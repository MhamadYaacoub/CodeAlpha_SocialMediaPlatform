services:
  - type: web
    name: socially-app
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: socially-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: socially-db
    plan: free
    databaseName: socially
    user: socially
    postgresMajorVersion: "17"
