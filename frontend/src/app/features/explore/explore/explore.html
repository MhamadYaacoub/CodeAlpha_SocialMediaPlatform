<section class="page"><header><h1>Explore people</h1><p>Find and connect with your community.</p></header><form class="search" (ngSubmit)="load()"><input name="search" [(ngModel)]="search" placeholder="Search by name or username"><button>Search</button></form>@if(error()){<p class="error">{{error()}}</p>}<div class="people">@for(user of users();track user.id){<article><button class="avatar profile-link" (click)="profile(user)">@if(user.profileImage){<img [src]="user.profileImage" [alt]="user.name">}@else{{{user.name[0]}}}</button><button class="info profile-link" (click)="profile(user)"><strong>{{user.name}}</strong><span>@{{user.username}}</span><p>{{user.bio || 'New to Socially'}}</p></button><button [disabled]="isProcessing(user.id)" (click)="follow(user)" [class.active]="user.following">{{isProcessing(user.id)?'Saving…':user.following?'Following':user.requestStatus==='pending'?'Requested':'Follow'}}</button><button [disabled]="isProcessing(user.id)" (click)="message(user)">Message</button></article>}@if(!loading()&&users().length===0){<p class="empty">No people found.</p>}</div></section>
