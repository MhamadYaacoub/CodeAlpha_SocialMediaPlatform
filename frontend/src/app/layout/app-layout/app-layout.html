<div class="app-shell">

  <aside class="left-column">
    <app-sidebar />
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>

  <aside class="right-column">
    <app-right-sidebar />
  </aside>

  <app-mobile-nav />
  <app-notifications />
  <label class="language-switcher" [attr.aria-label]="language.text('language')"><span>文</span><select [value]="language.language()" (change)="changeLanguage($event)"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></label>

</div>
